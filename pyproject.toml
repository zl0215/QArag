[project]
name = "rag-agent"
version = "0.1.0"
description = "知识库问答 RAG Agent — FastAPI + LangGraph + Milvus + PostgreSQL + Neo4j"
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    # ---- Web ----
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.20",

    # ---- 配置 / 校验 ----
    "pydantic>=2.9",
    "pydantic-settings>=2.5",

    # ---- 存储 ----
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30",
    "pymilvus>=2.6,<2.7",
    "neo4j>=5.26,<7",

    # ---- Agent ----
    "langgraph>=1.0,<2",
    "langchain-core>=1.0",
    "langgraph-checkpoint-postgres>=2.0",
    # ★ 必须是 psycopg[binary]，不能只写 psycopg。
    #   langgraph-checkpoint-postgres 只声明了 psycopg，装出来的是纯 Python 版，
    #   它需要一个**系统级 libpq**。Windows 上没有 → import 直接失败；
    #   Ubuntu 上要先 apt install libpq5，是个容易漏掉的外部依赖。
    #   [binary] 附带预编译好的 libpq，跨平台开箱可用。
    "psycopg[binary]>=3.2",

    # ---- 模型客户端（OpenAI 兼容：DeepSeek / 硅基流动 / vLLM / OpenAI）----
    "openai>=1.60",
    "httpx>=0.27",

    # ---- 文档解析 ----
    "pdfplumber>=0.11",
    "pypdf>=5",
    "python-docx>=1.1",
    "markdown-it-py>=3",

    # ---- 其他 ----
    "structlog>=24.4",
    "numpy>=1.26",
    "aiofiles>=24",
]

[project.optional-dependencies]
# 本地模型（BGE / cross-encoder）。镜像里用 --build-arg WITH_LOCAL=true 启用。
# 本机开发用 `uv venv --system-site-packages` 直接复用全局 torch，无需重复安装。
local = [
    "sentence-transformers>=3",
    "torch>=2.2",
    "transformers>=4.40",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "ruff>=0.7",
]
# Milvus Lite：向量库变成**一个本地文件**，零网络依赖、不需要 Docker。
#
# ★ 必须是 extra、不能靠 `uv pip install milvus-lite` 临时装：
#   uv sync 会把环境同步成和 uv.lock **完全一致**，多余包会被卸载。
#   临时装的 milvus-lite 下次 uv sync 就没了 —— 表现是"昨天还好好的，
#   今天启动报 Milvus 初始化失败"。
#
# 代价（都在 docs/DEPLOY.md 记着）：BM25 的 IDF 统计是分段局部的，
# 不是全局的；一个 data_dir 只能被一个进程打开（所以和 worker 互斥）。
# 带 faiss-cpu + pyarrow，约 42MB，只在需要时用 --extra lite 拉。
lite = [
    "milvus-lite>=3",
]

# ★ 这里是 src 布局，项目**必须**能被装成一个包。
#
#   之前写的是 [tool.uv] package = false（"只装依赖，别装我自己"）。
#   后果是 uv sync 从不把 rag 装进 venv，于是：
#
#       $ python -c "import rag"
#       ModuleNotFoundError: No module named 'rag'
#
#   各个入口只好各打各的补丁绕过去 —— Dockerfile 设 PYTHONPATH=/app/src、
#   smoke 脚本写 sys.path.insert(0, "src")。而 docs/DEPLOY.md 里给 AutoDL 的
#   `uvicorn rag.main:app` 没有补丁，必然 ModuleNotFoundError。
#   更坑的是 setup_autodl.sh 的自检自己 sys.path.insert 了，会打印
#   "rag 包导入正常 ✓" —— 检查通过、实际命令失败。
#
#   装成真包之后，uvicorn / pytest / python -m 全部自然生效，那些补丁都可以退休。
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

# 说明：torch 的 CPU wheel 源**故意不写在这里**。
# 写进 [tool.uv.sources] 会让 uv 每次解析都去访问 download.pytorch.org，
# 国内网络下会长时间卡住（即使根本不安装 torch）。
# 需要本地模型时，在 Dockerfile 里用环境变量注入：
#     ENV UV_EXTRA_INDEX_URL=https://download.pytorch.org/whl/cpu

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "unit: 纯函数，毫秒级",
    "integration: 需要真实 Postgres / Milvus",
    "eval: 需要模型与评测集，夜间跑",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
